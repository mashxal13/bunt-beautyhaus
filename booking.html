<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin Buchen | BUNT Beautyhaus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { 500: '#52B771', 600: '#3D9457' } },
                    fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Flatpickr date picker (forces dd.mm.yyyy display) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <!-- Supabase Cloud Backend -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://zuuuorscgbtjrrqinbjf.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Izpxk6P6UEtm6f3WdTIo8Q_OAb1t8-5";
        const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function cloudLoad() {
            try {
                const { data, error } = await supa.from('site_data').select('data').eq('id', 1).single();
                if (error) throw error;
                if (data && data.data) localStorage.setItem('buntBeautyData', JSON.stringify(data.data));
            } catch (e) { console.warn('cloudLoad failed, using local copy:', e.message); }
        }

        async function cloudSave(obj) {
            try {
                const { error } = await supa.from('site_data').update({ data: obj, updated_at: new Date().toISOString() }).eq('id', 1);
                if (error) throw error;
            } catch (e) { console.warn('cloudSave failed:', e.message); }
        }
    </script>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("kA74luzGr16VFrRY0");
        })();
    </script>
</head>
<body class="font-sans bg-white text-gray-800 min-h-screen p-6">

    <div class="max-w-2xl mx-auto my-10 bg-green-50 border border-green-200 rounded-3xl p-8 shadow-2xl">
        <a href="index.html" class="inline-flex items-center text-xs text-emerald-400 hover:underline mb-6">
            <i class="fa-solid fa-arrow-left mr-2"></i> <span data-i18n="backHome">Zurück zur Startseite</span>
        </a>
        
        <h1 class="text-3xl font-serif font-bold text-black mb-2" data-i18n="bookTitle">Termin vereinbaren</h1>
        <p class="text-xs text-gray-500 mb-8" data-i18n="bookSubtitle">Wählen Sie Ihre Behandlung, eine/n Mitarbeiter/in und eine verfügbare Uhrzeit.</p>

        <form id="bookingForm" onsubmit="handleBookingSubmit(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1" data-i18n="lblService">Leistung auswählen</label>
                <select id="bookingService" required onchange="onServiceChange()" class="w-full bg-white border border-green-200 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
                    <option value="" data-i18n="optService">-- Leistung wählen --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1" data-i18n="lblEmployee">Mitarbeiter/in</label>
                <select id="bookingEmployee" required onchange="updateAvailableTimes()" class="w-full bg-white border border-green-200 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
                    <option value="" data-i18n="optEmployee">-- Zuerst Leistung wählen --</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1" data-i18n="lblDate">Wunschdatum</label>
                    <input type="date" id="bookingDate" required onchange="updateAvailableTimes()" class="w-full bg-white border border-green-200 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1" data-i18n="lblTime">Freier Uhrzeit-Slot</label>
                    <select id="bookingTime" required class="w-full bg-white border border-green-200 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
                        <option value="" data-i18n="optTime">-- Datum wählen --</option>
                    </select>
                </div>
            </div>

            <hr class="border-green-200 my-4">

            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1" data-i18n="lblName">Ihr Name</label>
                <input type="text" id="clientName" required placeholder="Vor- und Nachname" data-i18n-ph="phName" class="w-full bg-white border border-green-200 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1" data-i18n="lblPhone">Telefonnummer</label>
                    <input type="tel" id="clientPhone" required placeholder="+49 ..." class="w-full bg-white border border-green-200 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1" data-i18n="lblEmail">E-Mail</label>
                    <input type="email" id="clientEmail" required placeholder="name@example.com" class="w-full bg-white border border-green-200 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
                </div>
            </div>

            <button type="submit" id="submitBtn" data-i18n="submitBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-2xl transition-all mt-6">
                Termin verbindlich anfragen
            </button>
        </form>

        <div id="successMessage" class="hidden text-center py-8">
            <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl border border-emerald-500/20">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2 class="text-2xl font-serif font-bold text-white mb-2" data-i18n="thankYou">Vielen Dank!</h2>
            <p class="text-xs text-gray-500 mb-6" data-i18n="thankYouSub">Ihre Terminanfrage wurde erfolgreich übermittelt. Sie erhalten in Kürze eine Bestätigung per E-Mail.</p>
            <a href="index.html" class="inline-block px-6 py-2.5 bg-green-100 hover:bg-green-200 text-white text-xs font-bold rounded-xl" data-i18n="backHome">Zurück zur Startseite</a>
        </div>
    </div>

    <script>
        let storeData = JSON.parse(localStorage.getItem('buntBeautyData')) || { services: [], employees: [], bookings: [], blockedPeriods: [], extraSlots: [] };

        // --- Booking page translations ---
        const bookingTranslations = {
            de: { backHome:"Zurück zur Startseite", bookTitle:"Termin vereinbaren", bookSubtitle:"Wählen Sie Ihre Behandlung, eine/n Mitarbeiter/in und eine verfügbare Uhrzeit.", lblService:"Leistung auswählen", optService:"-- Leistung wählen --", lblEmployee:"Mitarbeiter/in", optEmployee:"-- Zuerst Leistung wählen --", lblDate:"Wunschdatum", lblTime:"Freier Uhrzeit-Slot", optTime:"-- Datum wählen --", lblName:"Ihr Name", phName:"Vor- und Nachname", lblPhone:"Telefonnummer", lblEmail:"E-Mail", submitBtn:"Termin verbindlich anfragen", thankYou:"Vielen Dank!", thankYouSub:"Ihre Terminanfrage wurde erfolgreich übermittelt. Sie erhalten in Kürze eine Bestätigung per E-Mail.", vacationMsg:"An diesem Tag ist Urlaub / geschlossen. Bitte wählen Sie ein anderes Datum." },
            en: { backHome:"Back to Home", bookTitle:"Book an Appointment", bookSubtitle:"Choose your treatment, a staff member and an available time.", lblService:"Select service", optService:"-- Choose service --", lblEmployee:"Staff member", optEmployee:"-- Choose service first --", lblDate:"Preferred date", lblTime:"Available time slot", optTime:"-- Choose date --", lblName:"Your name", phName:"First and last name", lblPhone:"Phone number", lblEmail:"E-Mail", submitBtn:"Request appointment", thankYou:"Thank you!", thankYouSub:"Your appointment request was sent successfully. You will receive a confirmation by e-mail shortly.", vacationMsg:"This day is closed / on holiday. Please choose another date." },
            ru: { backHome:"На главную", bookTitle:"Записаться на приём", bookSubtitle:"Выберите услугу, сотрудника и свободное время.", lblService:"Выберите услугу", optService:"-- Выберите услугу --", lblEmployee:"Сотрудник", optEmployee:"-- Сначала выберите услугу --", lblDate:"Желаемая дата", lblTime:"Свободное время", optTime:"-- Выберите дату --", lblName:"Ваше имя", phName:"Имя и фамилия", lblPhone:"Телефон", lblEmail:"E-Mail", submitBtn:"Записаться", thankYou:"Спасибо!", thankYouSub:"Ваша заявка успешно отправлена. В ближайшее время вы получите подтверждение по e-mail.", vacationMsg:"В этот день выходной / отпуск. Пожалуйста, выберите другую дату." },
            ua: { backHome:"На головну", bookTitle:"Записатися на прийом", bookSubtitle:"Оберіть послугу, працівника та вільний час.", lblService:"Оберіть послугу", optService:"-- Оберіть послугу --", lblEmployee:"Працівник", optEmployee:"-- Спочатку оберіть послугу --", lblDate:"Бажана дата", lblTime:"Вільний час", optTime:"-- Оберіть дату --", lblName:"Ваше ім'я", phName:"Ім'я та прізвище", lblPhone:"Телефон", lblEmail:"E-Mail", submitBtn:"Записатися", thankYou:"Дякуємо!", thankYouSub:"Вашу заявку успішно надіслано. Незабаром ви отримаете підтвердження на e-mail.", vacationMsg:"Цього дня зачинено / відпустка. Будь ласка, оберіть іншу дату." }
        };

        let bookingLang = localStorage.getItem('buntLang') || 'de';

        function applyBookingLanguage() {
            const t = bookingTranslations[bookingLang] || bookingTranslations.de;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (t[key]) el.setAttribute('placeholder', t[key]);
            });
            document.documentElement.lang = bookingLang;
        }

        function initPage() {
            const serviceSelect = document.getElementById('bookingService');
            (storeData.services || []).forEach(s => {
                const duration = s.duration || 30;
                serviceSelect.innerHTML += `<option value="${s.title}" data-duration="${duration}" data-assigned="${s.assignedTo}">${s.title} (${s.price} • ${duration} Min)</option>`;
            });

            // Set minimum date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('bookingDate').min = today;

            // Init Flatpickr: shows dd.mm.yyyy, stores yyyy-mm-dd
            flatpickr('#bookingDate', {
                dateFormat: 'Y-m-d',      // value kept as yyyy-mm-dd (internal)
                altInput: true,           // visible field
                altFormat: 'd.m.Y',       // shown as dd.mm.yyyy
                minDate: 'today',
                onChange: updateAvailableTimes
            });
        }

        function onServiceChange() {
            const serviceSelect = document.getElementById('bookingService');
            const empSelect = document.getElementById('bookingEmployee');
            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            const assigned = selectedOption.getAttribute('data-assigned');

            empSelect.innerHTML = '<option value="">-- Mitarbeiter/in wählen --</option>';

            if (assigned && assigned !== 'Alle') {
                empSelect.innerHTML += `<option value="${assigned}" selected>${assigned}</option>`;
            } else {
                (storeData.employees || []).forEach(emp => {
                    empSelect.innerHTML += `<option value="${emp}">${emp}</option>`;
                });
            }
            updateAvailableTimes();
        }

        function updateAvailableTimes() {
            const serviceSelect = document.getElementById('bookingService');
            const emp = document.getElementById('bookingEmployee').value;
            const dateStr = document.getElementById('bookingDate').value;
            const timeSelect = document.getElementById('bookingTime');

            timeSelect.innerHTML = '<option value="">-- Uhrzeit wählen --</option>';

            if (!serviceSelect.value || !emp || !dateStr) return;

            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            const duration = parseInt(selectedOption.getAttribute('data-duration')) || 30;

            const selectedDate = new Date(dateStr);
            const dayOfWeek = selectedDate.getDay(); // 0 = Sun, 1 = Mon ... 6 = Sat

            // Check blocked periods / vacations
            const isBlocked = (storeData.blockedPeriods || []).some(bp => {
                if (bp.employee !== 'Alle' && bp.employee !== emp) return false;
                return dateStr >= bp.startDate && dateStr <= bp.endDate;
            });

            if (isBlocked) {
                const t = bookingTranslations[bookingLang] || bookingTranslations.de;
                alert(t.vacationMsg);
                document.getElementById('bookingDate').value = '';
                timeSelect.innerHTML = `<option value="">${t.optTime}</option>`;
                return;
            }

            // Generate time slots based on service duration
            let times = [];

            // Standard Working Hours: Mon-Sat (1 to 6), 09:00 - 18:00
            if (dayOfWeek >= 1 && dayOfWeek <= 6) {
                let currentMinute = 9 * 60; // 09:00 in minutes
                const endMinute = 18 * 60;  // 18:00 in minutes

                while (currentMinute + duration <= endMinute) {
                    const h = String(Math.floor(currentMinute / 60)).padStart(2, '0');
                    const m = String(currentMinute % 60).padStart(2, '0');
                    times.push(`${h}:${m}`);
                    currentMinute += duration;
                }
            }

            // Add manual extra slots
            (storeData.extraSlots || []).forEach(es => {
                if (es.employee === emp && es.date === dateStr) {
                    if (!times.includes(es.time)) times.push(es.time);
                }
            });

            times.sort();

            // Filter out existing bookings
            const existingBookings = (storeData.bookings || []).filter(b => b.employee === emp && b.date === dateStr);
            const availableTimes = times.filter(t => !existingBookings.some(b => b.time === t));

            if (availableTimes.length > 0) {
                availableTimes.forEach(t => {
                    timeSelect.innerHTML += `<option value="${t}">${t} Uhr</option>`;
                });
            } else {
                timeSelect.innerHTML = '<option value="">Keine freien Slots an diesem Tag</option>';
            }
        }

        function handleBookingSubmit(e) {
            e.preventDefault();

            const serviceSelect = document.getElementById('bookingService');
            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            const duration = parseInt(selectedOption.getAttribute('data-duration')) || 30;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Wird gebucht...';

            const templateParams = {
                client_name: document.getElementById('clientName').value,
                client_email: document.getElementById('clientEmail').value,
                client_phone: document.getElementById('clientPhone').value,
                service: document.getElementById('bookingService').value,
                employee: document.getElementById('bookingEmployee').value,
                date: document.getElementById('bookingDate').value,
                date_display: (function(d){ if(!d) return ''; const p=d.split('-'); return p.length===3? p[2]+'.'+p[1]+'.'+p[0] : d; })(document.getElementById('bookingDate').value),
                time: document.getElementById('bookingTime').value,
                duration: duration
            };

            // Save booking locally
            const newBooking = { id: Date.now(), ...templateParams, clientName: templateParams.client_name, clientPhone: templateParams.client_phone, clientEmail: templateParams.client_email };
            if (!storeData.bookings) storeData.bookings = [];
            storeData.bookings.push(newBooking);
            localStorage.setItem('buntBeautyData', JSON.stringify(storeData));
            cloudSave(storeData);

            // Send notification via EmailJS
            emailjs.send('service_98yq0nk', 'template_cs50x7h', templateParams)
                .then(function(response) {
                    console.log('SUCCESS!', response.status, response.text);
                }, function(error) {
                    console.error('FAILED...', error);
                })
                .finally(function() {
                    document.getElementById('bookingForm').classList.add('hidden');
                    document.getElementById('successMessage').classList.remove('hidden');
                });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await cloudLoad();
            storeData = JSON.parse(localStorage.getItem('buntBeautyData')) || storeData;
            initPage();
            applyBookingLanguage();
        });
    </script>
</body>
</html>
